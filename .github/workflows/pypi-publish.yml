name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the approved files to PyPI
        type: boolean
        default: false
permissions: {}
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'abusezero/abusezero-python' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Build the release files
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          python -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/python" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r /dev/stdin <<'EOF'
          build==1.6.1 --hash=sha256:ecd351a4be9d35a9eaaba244a7687143c9c7d4aea6ac964e7e7ddab20cbcf4e7
          flit_core==4.2.0 --hash=sha256:2bee22dc8ba89c2e35b4e1ad575e596aac945c85672dd8f3cad21b629036e044
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject_hooks==1.3.3 --hash=sha256:5fc53fdac9f7bd63fbcdc868fb5f90b4784d78a53a3d3388cd738b807441a20b
          EOF
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          source="$RUNNER_TEMP/source"
          git archive --format=tar HEAD | (mkdir "$source" && tar -x -C "$source")
          find "$source" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          "$RUNNER_TEMP/build-env/bin/python" -m build --no-isolation --outdir "$RUNNER_TEMP/dist" "$source"
          version=$("$RUNNER_TEMP/build-env/bin/python" -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd "$RUNNER_TEMP/dist"
          [[ -f "abusezero-$version-py3-none-any.whl" && -f "abusezero-$version.tar.gz" && "$(ls | wc -l)" -eq 2 ]]
          sha256sum "abusezero-$version-py3-none-any.whl" "abusezero-$version.tar.gz" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
  publish:
    needs: build
    if: inputs.publish && github.repository == 'abusezero/abusezero-python' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: Production
      url: https://pypi.org/project/abusezero/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the approved files
        shell: bash
        env:
          RELEASE_WHEEL_SHA256: ${{ vars.RELEASE_WHEEL_SHA256 }}
          RELEASE_SDIST_SHA256: ${{ vars.RELEASE_SDIST_SHA256 }}
        run: |
          set -euo pipefail
          cd dist
          wheel=$(ls abusezero-*-py3-none-any.whl)
          sdist=$(ls abusezero-*.tar.gz)
          [[ "$(ls | wc -l)" -eq 2 ]]
          [[ "$RELEASE_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ && "$RELEASE_SDIST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n%s  %s\n' "$RELEASE_WHEEL_SHA256" "$wheel" "$RELEASE_SDIST_SHA256" "$sdist" | sha256sum --check --strict
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
